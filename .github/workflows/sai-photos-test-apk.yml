name: Sai Photos test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Install Rust targets
        run: rustup target add aarch64-linux-android
      - name: Get Flutter dependencies
        working-directory: mobile/apps/photos
        run: flutter pub get --enforce-lockfile
      - name: Generate Rust bindings
        working-directory: rust
        run: cargo codegen frb photos
      - name: Create test signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/sai-photos-test.jks" \
            -alias sai-photos-test -storepass TestBuildOnly2026 \
            -keypass TestBuildOnly2026 -keyalg RSA -keysize 3072 \
            -validity 3650 -dname 'CN=Sai Photos Test Build'
      - name: Build ARM64 APK
        working-directory: mobile/apps/photos
        env:
          SIGNING_KEY_PATH: ${{ runner.temp }}/sai-photos-test.jks
          SIGNING_KEY_ALIAS: sai-photos-test
          SIGNING_KEY_PASSWORD: TestBuildOnly2026
          SIGNING_STORE_PASSWORD: TestBuildOnly2026
        run: flutter build apk --release --flavor independent --target-platform android-arm64 --no-pub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sai-photos-test-arm64-apk
          path: mobile/apps/photos/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
